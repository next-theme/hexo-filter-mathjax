name: Linter

on: [push, pull_request]

jobs:
  linter:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '26'
    - name: Install Dependencies
      run: npm install
    - run: npm test
